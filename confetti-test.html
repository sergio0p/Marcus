<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sea Creature Confetti — test</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #0b1828;
      color: #faf3e6;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      overflow: hidden;
    }

    h1 { margin: 0; font-size: 28px; letter-spacing: 0.5px; }

    button {
      font-family: inherit;
      font-size: 18px;
      padding: 10px 22px;
      border: 2px solid #faf3e6;
      background: transparent;
      color: #faf3e6;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    button:hover { background: #faf3e6; color: #0b1828; }

    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 100;
    }

    .confetti span {
      position: absolute;
      top: -60px;
      line-height: 1;
      animation: confetti-fall linear forwards;
      will-change: transform;
    }

    /* Monotonic drift: every piece drifts steadily in the same horizontal
       direction (set per-shower by JS), with per-piece amplitude jitter so
       they don't all travel in lockstep. No zig-zag — feels like a sea
       current rather than fluttering. */
    @keyframes confetti-fall {
      0%   { transform: translate(0,         0)     rotate(0); opacity: 1; }
      85%  {                                                   opacity: 1; }
      100% { transform: translate(var(--dx), 110vh) rotate(720deg); opacity: 0.55; }
    }
  </style>
</head>
<body>
  <h1>🌊 Sea Creature Confetti</h1>
  <button id="replay" type="button">Replay</button>

  <script>
    const CREATURES = ['🐳','🐋','🐬','🦭','🦦','🐟','🐠','🐡','🦈','🐙','🦑','🦀','🦞','🦐','🐢','🪼','🪸','🐚'];

    // Tuned for iPad (768–1366 CSS px). Scales gracefully on phone and desktop
    // by deriving size and count from the viewport's smaller dimension.
    function rain() {
      const layer = document.createElement('div');
      layer.className = 'confetti';
      document.body.appendChild(layer);

      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const vmin = Math.min(vw, vh);

      // Both count and size scale with vmin (smaller viewport dimension), so a
      // bigger screen feels appropriately dense AND has bigger creatures, while
      // a phone gets a sparser, smaller-but-readable shower.
      // Reference: iPad portrait (vmin ≈ 768) → 70 pieces at ~46px base size.
      const REF_VMIN = 768;
      const scale = vmin / REF_VMIN;

      const pieces     = Math.round(Math.max(30, Math.min(200, 70 * scale)));
      const baseSize   = Math.max(26, Math.min(96, 46 * scale));
      const sizeJitter = baseSize * 0.7;

      // Fall: slightly slower on tall screens so the rain lasts long enough.
      const fallBase = 2.2 + (vh / 900) * 0.8;
      const fallJitter = 1.6;

      // Sea current: every shower picks one drift direction. Each piece gets
      // a slightly different drift magnitude so they spread instead of
      // moving in lockstep — no collisions, no zig-zag.
      const currentDir = Math.random() < 0.5 ? -1 : 1;

      for (let i = 0; i < pieces; i++) {
        const piece = document.createElement('span');
        piece.textContent = CREATURES[Math.floor(Math.random() * CREATURES.length)];
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.animationDuration = `${fallBase + Math.random() * fallJitter}s`;
        piece.style.animationDelay = `${Math.random() * 0.6}s`;
        piece.style.fontSize = `${baseSize + Math.random() * sizeJitter}px`;
        // Drift amplitude — 8–22% of viewport width in the shower's current
        // direction. Same sign for every piece, magnitude varies per piece.
        const amp = (8 + Math.random() * 14) * currentDir;
        piece.style.setProperty('--dx', `${amp}vw`);
        layer.appendChild(piece);
      }

      // Clean up after the slowest piece + delay finishes.
      setTimeout(() => layer.remove(), (fallBase + fallJitter + 0.6) * 1000 + 200);
    }

    document.getElementById('replay').addEventListener('click', rain);
    window.addEventListener('load', rain);
  </script>
</body>
</html>
